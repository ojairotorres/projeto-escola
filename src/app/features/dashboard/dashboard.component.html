<header class="header">
  <button mat-icon-button (click)="toggleSidenav()">
    <mat-icon>menu</mat-icon>
  </button>
  <span class="title">Painel da Escola</span>
  <span class="spacer"></span>
  <button mat-button color="warn" (click)="logout()">Sair</button>
</header>

<mat-sidenav-container class="sidenav-container-full">
  <mat-sidenav
    #sidenav
    [mode]="'side'"
    [opened]="true"
    [class.collapsed]="isCollapsed"
    class="sidenav"
  >
    <div class="menu">
      <ng-container *ngFor="let item of menuItems">
        <button
          mat-button
          [routerLink]="!item.children ? item.link : null"
          class="menu-item"
          matTooltip="{{ item.label }}"
          matTooltipPosition="right"
          (click)="toggleSubmenu(item)"
        >
          <mat-icon>{{ item.icon }}</mat-icon>
          <span class="label" *ngIf="!isCollapsed">{{ item.label }}</span>
          <mat-icon
            class="submenu-arrow"
            *ngIf="item.children && !isCollapsed"
            [ngClass]="{ 'open': item.isSubmenuOpen }"
            >chevron_right</mat-icon
          >
        </button>
        <div
          class="submenu"
          *ngIf="item.children && item.isSubmenuOpen"
        >
          <button
            *ngFor="let child of item.children"
            mat-button
            [routerLink]="child.link"
            class="submenu-item"
          >
            <span class="label">{{ child.label }}</span>
          </button>
        </div>
      </ng-container>
    </div>
  </mat-sidenav>

  <mat-sidenav-content class="main-content">
    <router-outlet></router-outlet>
  </mat-sidenav-content>
</mat-sidenav-container>
